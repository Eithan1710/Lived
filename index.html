<html lang="he" dir="rtl">
<head>

<style>
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --line:#E8EAEE;
  --ink:#0F172A; --ink2:#475569; --muted:#94A3B8; --faint:#CBD5E1;
  --accent:#4F46E5; --accent-2:#4338CA; --accent-soft:#EEF2FF;
  --danger:#DC2626;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:'Heebo',-apple-system,'Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; min-height:100dvh;}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0;}
input,textarea{font:inherit; color:inherit;}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px;}
svg.i{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:none;}
[hidden]{display:none !important;}

.wrap{max-width:560px; margin:0 auto; padding:calc(var(--sat) + 28px) 20px calc(var(--sab) + 40px);}

/* brand */
.brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.brand img{width:40px; height:40px; border-radius:12px;}
.brand h1{margin:0; font-size:28px; font-weight:900; letter-spacing:-.8px; line-height:1;}
.brand p{margin:3px 0 0; font-size:14px; color:var(--muted);}

/* composer */
.box{position:relative; border:1.5px solid var(--line); border-radius:20px; background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 28px -18px rgba(15,23,42,.25); transition:border-color .15s, box-shadow .15s;}
.box:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.box textarea{display:block; width:100%; border:0; background:transparent; resize:none; outline:none; font-size:18px; line-height:1.45; padding:16px 16px 16px 66px; min-height:58px; max-height:180px;}
.box textarea::placeholder{color:var(--muted);}
.go{position:absolute; left:8px; bottom:8px; width:42px; height:42px; border-radius:13px; background:var(--accent); color:#fff; display:grid; place-items:center; transition:background .15s, transform .1s, opacity .15s;}
.go:hover{background:var(--accent-2);}
.go:active{transform:scale(.94);}
.go:disabled{opacity:.3; pointer-events:none;}
.spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* review card */
.review{margin-top:14px; animation:up .22s var(--ease);}
@keyframes up{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.card{border:1.5px solid var(--line); border-radius:20px; padding:18px 18px 6px; background:#fff;}
.c-head{display:flex; gap:12px; align-items:center; margin-bottom:6px;}
.emoji{width:48px; height:48px; border-radius:15px; background:var(--soft); display:grid; place-items:center; font-size:25px; flex:none;}
.c-title{width:100%; border:0; border-bottom:2px solid transparent; font-size:21px; font-weight:800; letter-spacing:-.2px; padding:2px 0; background:transparent; outline:none; min-width:0;}
.c-title:focus{border-color:var(--accent);}
.c-meta{display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted);}
.tag{font-size:12px; font-weight:700; border-radius:99px; padding:1px 9px;}
.tag.past{background:var(--soft); color:var(--ink2);}
.tag.up{background:var(--accent-soft); color:var(--accent);}
.row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-size:16px; min-height:50px;}
.row:first-child{border-top:0;}
.row svg{color:var(--muted); width:20px; height:20px;}
.row .val{flex:1; min-width:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.row input.txt{flex:1; min-width:0; border:0; outline:none; background:transparent; font-size:16px; padding:0;}
.dim{color:var(--muted);}
.pick{position:relative; display:inline-flex; align-items:center; border-radius:8px; padding:2px 6px; margin:-2px -6px; font-weight:600; font-variant-numeric:tabular-nums; cursor:pointer;}
.pick:hover{background:var(--soft);}
.pick input{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; cursor:pointer;}
.pick.soft{font-weight:500; color:var(--ink2);}
.sub{color:var(--muted); font-size:14px; margin-inline-start:4px;}
.cta{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:56px; margin-top:12px; border-radius:16px; background:var(--accent); color:#fff; font-size:17px; font-weight:700;
  box-shadow:0 12px 26px -14px var(--accent); transition:background .15s, transform .1s;}
.cta:hover{background:var(--accent-2);}
.cta:active{transform:scale(.985);}
.cta-note{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:8px; font-size:13px; color:var(--muted);}
.cta-note button{color:var(--ink2); font-size:14px; padding:6px 10px; border-radius:9px;}
.cta-note button:hover{background:var(--soft);}
.thinking{margin-top:14px; display:flex; align-items:center; gap:8px; color:var(--accent); font-weight:600; font-size:15px; padding:6px 4px;}
.dots{display:inline-flex; gap:3px;} .dots b{width:5px; height:5px; border-radius:50%; background:currentColor; animation:blink 1s infinite;}
.dots b:nth-child(2){animation-delay:.15s;} .dots b:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,100%{opacity:.25;} 50%{opacity:1;}}

/* timeline */
.sec{margin-top:36px;}
.sec > h2{font-size:13px; font-weight:800; letter-spacing:.04em; color:var(--muted); margin:0 0 6px;}
.sec.up > h2{color:var(--accent);}
.month{font-size:20px; font-weight:800; letter-spacing:-.3px; margin:22px 0 4px;}
.month:first-of-type{margin-top:8px;}
.month small{font-weight:500; color:var(--muted); font-size:15px; margin-inline-start:6px;}
ol.tl{list-style:none; margin:0; padding:0;}
.ev{display:grid; grid-template-columns:44px 22px minmax(0,1fr); align-items:stretch;}
.ev .d{text-align:center; padding-top:13px; line-height:1.05;}
.ev .d b{display:block; font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.4px;}
.ev .d span{font-size:12px; color:var(--muted); font-weight:600;}
.ev .rail{position:relative; display:flex; justify-content:center;}
.ev .rail::before{content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--line); border-radius:2px;}
.ev:first-child .rail::before{top:22px;}
.ev:last-child .rail::before{bottom:calc(100% - 22px);}
.ev:only-child .rail::before{display:none;}
.ev .rail i{position:relative; margin-top:17px; width:12px; height:12px; border-radius:50%; background:#fff; border:2.5px solid var(--faint); z-index:1;}
.ev .body{display:block; width:100%; text-align:start; padding:10px 12px 12px; margin:2px 0; border-radius:14px; transition:background .12s;}
.ev .body:hover{background:var(--soft);}
.ev .t{display:block; font-size:17px; font-weight:700; line-height:1.3; overflow-wrap:anywhere;}
.ev .t em{font-style:normal; margin-inline-end:6px;}
.ev .m{display:block; font-size:14px; color:var(--ink2); margin-top:2px;}
.ev.same .d{visibility:hidden;}
.ev.up .rail i{border-color:var(--accent); background:var(--accent-soft);}
.ev.up .d b{color:var(--accent);}
.ev.up .m .rel{color:var(--accent); font-weight:700;}
.ev.flash .body{animation:flash 1.6s var(--ease);}
@keyframes flash{0%,35%{background:var(--accent-soft);} 100%{background:transparent;}}
.more{display:none; padding:2px 12px 12px; font-size:14px; color:var(--ink2);}
.ev.open .more{display:block; animation:up .15s var(--ease);}
.ev.open .body{background:var(--soft); border-radius:14px 14px 0 0; margin-bottom:0;}
.ev.open .more{background:var(--soft); border-radius:0 0 14px 14px; margin-bottom:4px;}
.more p{margin:0 0 8px; white-space:pre-wrap; overflow-wrap:anywhere;}
.acts{display:flex; gap:6px; flex-wrap:wrap;}
.acts a, .acts button{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:10px; background:#fff; font-size:14px; font-weight:600; color:var(--ink); text-decoration:none; border:1px solid var(--line);}
.acts .del{color:var(--danger);}
.acts .del.sure{background:var(--danger); color:#fff; border-color:var(--danger);}

.empty{margin-top:44px; text-align:center; padding:0 8px;}
.empty .ill{width:64px; height:64px; margin:0 auto 14px; border-radius:20px; background:var(--soft); display:grid; place-items:center; font-size:30px;}
.empty h2{font-size:21px; font-weight:800; margin:0 0 6px; letter-spacing:-.2px;}
.empty p{margin:0 0 18px; color:var(--ink2);}
.examples{display:flex; flex-direction:column; align-items:center; gap:8px;}
.examples button{font-size:14.5px; color:var(--ink2); background:var(--soft); border-radius:99px; padding:8px 14px; transition:background .12s;}
.examples button:hover{background:#ECEEF2;}
.nopast{color:var(--muted); font-size:15px; padding:10px 0;}

.foot{margin-top:48px; text-align:center; font-size:13px; color:var(--muted);}
.foot button{color:var(--muted); text-decoration:underline; font-size:13px;}

.toast{position:fixed; left:50%; width:max-content; bottom:calc(24px + var(--sab)); transform:translateX(-50%); background:var(--ink); color:#fff; border-radius:14px; padding:12px 18px; font-size:15px; max-width:calc(100vw - 32px); box-shadow:0 16px 40px -16px rgba(15,23,42,.5); animation:up .2s var(--ease); z-index:10;}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
</style>
<!-- Public deployment settings (Google OAuth Client ID, AI endpoint). Generated at deploy time; see README. -->
<script src="config.js"></script>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <img src="icon.svg" alt="">
    <div><h1>Lived</h1><p>ההיסטוריה האישית שלך</p></div>
  </header>

  <form id="form" autocomplete="off">
    <div class="box">
      <textarea id="text" rows="1" enterkeyhint="go" aria-label="מה קרה?" placeholder="מה קרה? או מה מתוכנן?"></textarea>
      <button type="submit" class="go" id="go" aria-label="המשך" disabled><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    </div>
  </form>
  <section id="review" aria-live="polite"></section>

  <div id="timeline"></div>

  <footer class="foot" id="foot"></footer>
</main>
<script>
'use strict';
/* =====================================================================
   Lived — a personal timeline of events.
   Write what happened (or what's coming) → it's understood → saved to the timeline + Google Calendar.

   Settings come from config.js (window.LIVED_CONFIG), generated at deploy time. Both are public values:
   - GOOGLE_CLIENT_ID: OAuth Web client ID (not a secret). With it, events go straight into Google Calendar;
     without it, Google Calendar opens with the event pre-filled.
   - AI_ENDPOINT: URL of ai/worker.js. Without it, the built-in parser (runs in the browser) is used.
   No API key or other secret is ever in this file.
   ===================================================================== */
const CONFIG = Object.assign({GOOGLE_CLIENT_ID:'', AI_ENDPOINT:''}, window.LIVED_CONFIG || {});

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
function sod(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function hm(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function todayLocal(){ return sod(new Date()); }
const dayDiff = d => Math.round((sod(d)-todayLocal())/DAY);
const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:JSON.parse(v); }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sleep = ms => new Promise(r=>setTimeout(r, ms));

const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const EN_MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const EN_DAYS = [['sunday','sun'],['monday','mon'],['tuesday','tue','tues'],['wednesday','wed'],['thursday','thu','thur','thurs'],['friday','fri'],['saturday','sat']];

function relDay(d){
  const n = dayDiff(d);
  return n===0?'היום' : n===1?'מחר' : n===-1?'אתמול' : n===2?'מחרתיים' : n===-2?'שלשום'
    : (n>2 && n<7) ? `בעוד ${n} ימים` : (n<-2 && n>-7) ? `לפני ${-n} ימים` : '';
}
function fullDate(d){
  return `יום ${DAYS[d.getDay()]}, ${d.getDate()} ב${MONTHS[d.getMonth()]}` + (d.getFullYear()!==new Date().getFullYear() ? ` ${d.getFullYear()}` : '');
}

/* =====================================================================
   Categories — picked automatically. g = Google Calendar event color.
   ===================================================================== */
const CATS = [
  {k:'birthday', e:'🎂', l:'יום הולדת', g:'5',  words:['יום הולדת','יומולדת','יום-הולדת','birthday','bday']},
  {k:'health',   e:'🩺', l:'בריאות',   g:'11', words:['רופא','רופאה','רופא שיניים','בדיקה','בדיקות','טיפול','קופת חולים','doctor','dentist','checkup']},
  {k:'date',     e:'❤️', l:'דייט',     g:'4',  words:['דייט','רומנטי','date']},
  {k:'sport',    e:'⚽', l:'ספורט',    g:'2',  words:['כדורגל','כדורסל','טניס','פאדל','משחק','football','soccer','basketball','tennis','match','game']},
  {k:'gym',      e:'🏋️', l:'כושר',     g:'10', words:['כושר','חדר כושר','אימון','ריצה','יוגה','פילאטיס','gym','workout','run','yoga','pilates']},
  {k:'trip',     e:'✈️', l:'טיול',     g:'7',  words:['טיול','טיסה','חופשה','נסיעה','ים','חוף','trip','beach','flight','vacation','travel','hike']},
  {k:'show',     e:'🎬', l:'בידור',    g:'3',  words:['סרט','קולנוע','הופעה','הצגה','מופע','movie','cinema','concert','show']},
  {k:'study',    e:'📚', l:'לימודים',  g:'9',  words:['שיעור','מבחן','בחינה','הרצאה','קורס','לימודים','class','exam','lecture','course']},
  {k:'work',     e:'💼', l:'עבודה',    g:'9',  words:['פגישה','פגישת','ישיבה','ישיבת','עבודה','שיחה','זום','ראיון','meeting','call','work','zoom','interview','sync']},
  {k:'food',     e:'🍽️', l:'ארוחה',    g:'6',  words:['ארוחה','ארוחת','מסעדה','קפה','בראנץ׳','בראנץ','dinner','lunch','breakfast','brunch','restaurant','coffee']},
  {k:'family',   e:'👨‍👩‍👧', l:'משפחה',    g:'6',  words:['משפחה','הורים','אמא','אבא','סבתא','סבא','אחי','אחותי','family','mom','dad']},
  {k:'friends',  e:'🎉', l:'חברים',    g:'7',  words:['חברים','יציאה','מסיבה','בר','פאב','friends','party','bar','drinks']},
  {k:'other',    e:'📌', l:'אירוע',    g:'',   words:[]}
];
const catObj = k => CATS.find(c=>c.k===k) || CATS[CATS.length-1];

/* =====================================================================
   Built-in parser (Hebrew + English), runs in the browser.
   Understands past ("אתמול", "Yesterday I had…", "ביום שישי שעבר") and future ("מחר", "next Friday").
   ===================================================================== */
const HEB = '[א-ת׳״]';
const HE_PREFIXES = ['ב','ל','מ','ו','ה','כ','ש'];
const PAST_CUES = new RegExp(`(?<!${HEB})(?:אתמול|שלשום|שעבר|שעברה|לפני|היה|היתה|הייתה|הייתי|היינו|הלכתי|הלכנו|יצאתי|יצאנו|ראיתי|ראינו|אכלתי|אכלנו|פגשתי|נפגשנו|חגגנו|חגגתי)(?!${HEB})|\\b(?:yesterday|last|ago|had|was|were|went|met|saw|did|celebrated)\\b`, 'i');
const FUTURE_CUES = new RegExp(`(?<!${HEB})(?:מחר|מחרתיים|הבא|הבאה|הקרוב|הקרובה|יהיה|תהיה|אני אהיה|נלך|אלך)(?!${HEB})|\\b(?:tomorrow|next|will|going to|upcoming)\\b|'ll\\b`, 'i');

function tokenForms(token){
  const forms = new Set([token]);
  if(token.length>1 && HE_PREFIXES.includes(token[0])){
    forms.add(token.slice(1));
    if(token.length>2 && HE_PREFIXES.includes(token[1])) forms.add(token.slice(2));
  }
  return forms;
}
function detectCategory(text){
  const lower = text.toLowerCase();
  const forms = new Set();
  lower.split(/[^א-תa-z׳'-]+/).filter(Boolean).forEach(t=>tokenForms(t).forEach(f=>forms.add(f)));
  const has = w => /[\s-]/.test(w) ? lower.includes(w) : forms.has(w);
  return CATS.find(c=>c.words.some(has)) || catObj('other');
}

// A date without a year: in the past if the text talks about the past, in the future if it talks
// about the future, otherwise whichever is closer to today.
function placeYear(month, day, dir){
  const t = todayLocal(), y = t.getFullYear();
  const cands = [y-1, y, y+1].map(yy=>new Date(yy, month, day));
  if(dir==='past') return cands.filter(c=>c<=t).pop();
  if(dir==='future') return cands.find(c=>c>=t);
  return cands.reduce((a,b)=>Math.abs(b-t)<Math.abs(a-t)?b:a);
}
function detectDate(text, dir){
  const today = todayLocal(), lower = text.toLowerCase();
  const hit = (date, s) => ({date, strs:[s], found:true});
  const sub = m => text.substr(m.index, m[0].length);
  let m;
  // "20 באוקטובר", "ה-3 לדצמבר 2027"
  m = text.match(new RegExp(`(?:ב-?|ה-?)?(\\d{1,2})\\s*(?:ב|ל)?(${MONTHS.join('|')})(?:\\s+(\\d{4}))?(?!${HEB})`));
  if(m && +m[1]>=1 && +m[1]<=31) return hit(m[3] ? new Date(+m[3], MONTHS.indexOf(m[2]), +m[1]) : placeYear(MONTHS.indexOf(m[2]), +m[1], dir), m[0]);
  // "October 20", "20 Oct", "Sep 24th"
  const enM = `(${EN_MONTHS.map(x=>x+'[a-z]*').join('|')})`;
  m = lower.match(new RegExp(`\\b(?:on\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?${enM}\\b`));
  if(m) return hit(placeYear(EN_MONTHS.indexOf(m[2].slice(0,3)), +m[1], dir), sub(m));
  m = lower.match(new RegExp(`\\b(?:on\\s+)?${enM}\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b`));
  if(m) return hit(placeYear(EN_MONTHS.indexOf(m[1].slice(0,3)), +m[2], dir), sub(m));
  // "12/10", "12.10.2026"
  m = text.match(/(?<![\d:])(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?![\d:])/);
  if(m && +m[2]>=1 && +m[2]<=12 && +m[1]>=1 && +m[1]<=31){
    const d = m[3] ? new Date(m[3].length===2 ? 2000 + +m[3] : +m[3], +m[2]-1, +m[1]) : placeYear(+m[2]-1, +m[1], dir);
    return hit(d, m[0]);
  }
  // relative words
  const he = (w, n) => { const r = text.match(new RegExp(`(?<!${HEB})(?:ב|ל|ה)?${w}(?!${HEB})`)); return r ? hit(addDays(today,n), r[0]) : null; };
  const r = he('מחרתיים',2) || he('שלשום',-2) || he('אתמול',-1) || he('מחר',1) || he('היום',0);
  if(r) return r;
  if((m=text.match(/לפני\s+(\d+)\s+ימים/))) return hit(addDays(today,-m[1]), m[0]);
  if((m=text.match(/לפני\s+יומיים/))) return hit(addDays(today,-2), m[0]);
  if((m=lower.match(/\b(\d+)\s+days?\s+ago\b/))) return hit(addDays(today,-m[1]), sub(m));
  if((m=lower.match(/\bday after tomorrow\b/))) return hit(addDays(today,2), sub(m));
  if((m=lower.match(/\bday before yesterday\b/))) return hit(addDays(today,-2), sub(m));
  if((m=lower.match(/\byesterday\b/))) return hit(addDays(today,-1), sub(m));
  if((m=lower.match(/\btomorrow\b|\btmrw\b/))) return hit(addDays(today,1), sub(m));
  if((m=lower.match(/\btoday\b|\btonight\b/))) return hit(today, /tonight/.test(m[0]) ? '' : sub(m));
  // weekdays: "ביום ראשון", "ביום שישי שעבר", "בחמישי", "last Friday", "on Sunday"
  for(let i=0;i<7;i++){
    const h = text.match(new RegExp(`(?<!${HEB})(?:(?:ב|ל)?יום\\s+|ב)${DAYS[i]}(?:\\s+(הבא|הקרוב|שעבר))?(?!${HEB})`));
    const e = lower.match(new RegExp(`\\b(?:(next|last|this|on)\\s+)?(?:${EN_DAYS[i].join('|')})\\b`));
    if(!h && !e) continue;
    const s = h ? h[0] : sub(e);
    const mod = h ? h[1] : e[1];
    const back = mod==='שעבר' || mod==='last' || (!mod || mod==='on' || mod==='this') && dir==='past';
    const fwd = (i - today.getDay() + 7) % 7;
    let diff;
    if(back) diff = -(((today.getDay() - i + 7) % 7) || 7);
    else diff = (fwd===0 && (mod==='הבא' || mod==='next')) ? 7 : fwd;
    return hit(addDays(today, diff), s);
  }
  return {date:today, strs:[], found:false};
}

const EVENING = /בערב|בלילה|אחר הצהריים|אחה״צ|אחה"צ|בצהריים|evening|night|afternoon|\bpm\b/i;
const MORNING = /בבוקר|morning|\bam\b/i;
function timeParts(str, ctx){
  const m = str.match(/(\d{1,2})(?::(\d{2}))?\s*(וחצי|ורבע|am|pm|a\.m\.|p\.m\.)?/i);
  if(!m) return null;
  let h = +m[1], mi = m[2] ? +m[2] : 0;
  const suf = (m[3]||'').toLowerCase();
  if(suf==='וחצי') mi = 30; else if(suf==='ורבע') mi = 15;
  if(suf[0]==='p' && h<12) h += 12;
  if(suf[0]==='a' && h===12) h = 0;
  // "ב-8 בערב" → 20:00, "ב-3" → 15:00
  if(!/^[ap]/.test(suf) && h>=1 && h<12 && (EVENING.test(ctx) || (h<=7 && !MORNING.test(ctx)))) h += 12;
  if(h>24 || mi>59) return null;
  return {h:h%24, m:mi};
}
const T = '(\\d{1,2}(?::\\d{2})?(?:\\s*(?:וחצי|ורבע|am|pm|a\\.m\\.|p\\.m\\.))?)';
function detectTimes(text){
  let m = text.match(new RegExp(`(?:בין|מ-?|משעה|from)?\\s*${T}\\s*(?:-|–|עד|ל-?|to|until)\\s*${T}`, 'i'));
  if(m && (/:|am|pm|וחצי/i.test(m[0]) || /בין|מ-?|משעה|from/.test(m[0]))){
    const s=timeParts(m[1], text), e=timeParts(m[2], text);
    if(s && e) return {start:s, end:e, strs:[m[0]]};
  }
  m = text.match(new RegExp(`(?:ב-?|בשעה\\s*|at\\s+|@\\s*)${T}(?![\\d/.])`, 'i'));
  if(m){ const s=timeParts(m[1], text); if(s) return {start:s, strs:[m[0]]}; }
  m = text.match(/(?<![\d./])(\d{1,2}:\d{2}|\d{1,2}\s*(?:am|pm))(?![\d./])/i);
  if(m){ const s=timeParts(m[1], text); if(s) return {start:s, strs:[m[0]]}; }
  const TOD = [['אחר הצהריים',16],['בצהריים',13],['בבוקר',9],['בערב',19],['הערב',19],['בלילה',22],['morning',9],['noon',12],['afternoon',16],['evening',19],['tonight',20]];
  for(const [w,h] of TOD){
    const mm = text.match(/^[a-z]/.test(w) ? new RegExp(`\\b(?:in the |this |at )?${w}\\b`,'i') : new RegExp(`(?<!${HEB})${w}(?!${HEB})`));
    if(mm) return {start:{h, m:0}, strs:[mm[0]]};
  }
  return {start:null, strs:[]};
}
function strip(text, strs){ let t = text; (strs||[]).forEach(s=>{ if(s) t = t.replace(s,' '); }); return t; }
function cleanTitle(text){
  const stop = new Set(['בין','מ-','משעה','עד','ל-','ב-','ב','ל','בשעה','הבא','הבאה','הקרוב','שעבר','-','–','at','on','from','to','next','last','the','this','in']);
  let t = text.replace(new RegExp(`(?<!${HEB})(?:בבוקר|בצהריים|אחר הצהריים|אחה״צ|אחה"צ|בערב|בלילה)(?!${HEB})`,'g'),' ')
              .replace(/[,،.!]+/g,' ').replace(/\s+/g,' ').trim();
  // "הייתי בארוחה…" → "ארוחה…", "היה לי מבחן" → "מבחן", "I had dinner…" → "dinner…"
  t = t.replace(new RegExp(`^(?:(?:היה|היתה|הייתה|יש|תהיה|יהיה)\\s+(?:לי|לנו)|קבעתי|קבענו)\\s+`), '')
       .replace(new RegExp(`^(?:הייתי|היינו|הלכתי|הלכנו|יצאתי|יצאנו|אני הולך|אני הולכת|אני אהיה|נלך|אלך)\\s+(?:[בל](?=${HEB}{2}))?`), '')
       .replace(/^(?:i|we)\s+(?:had|have|went|go|was|were|am|are|will have|will go|will|'ll have|'ll go)\s+(?:to\s+)?(?:a\s+|an\s+|the\s+)?/i, '')
       .replace(/^(?:had|went to|have)\s+(?:a\s+|an\s+|the\s+)?/i, '');
  const words = t.split(' ').filter(Boolean);
  while(words.length && stop.has(words[words.length-1].toLowerCase())) words.pop();
  while(words.length && stop.has(words[0].toLowerCase())) words.shift();
  t = words.filter(w=>!['ב-','ל-','מ-','בשעה','-','–'].includes(w)).join(' ').trim();
  return /^[a-z]/.test(t) ? t[0].toUpperCase() + t.slice(1) : t;
}
const CAT_WORDS = new Set(CATS.flatMap(c=>c.words));
function splitLocation(text){
  const at = text.match(/\s(?:@|at|in)\s+(.+)$/i);
  if(at) return {title:text.slice(0,at.index).trim(), location:at[1].trim()};
  const words = text.split(/\s+/).filter(Boolean);
  for(let i=1;i<words.length;i++){
    const w = words[i];
    if(w[0]==='ב' && w.length>2 && !CAT_WORDS.has(w) && !CAT_WORDS.has(w.slice(1)) && !['בלי','בשביל','ביחד','בערך','בבית'].includes(w)){
      const title = words.slice(0,i).join(' ').trim();
      const location = (w.slice(1) + ' ' + words.slice(i+1).join(' ')).trim();
      if(title) return {title, location};
    }
  }
  return {title:words.join(' ').trim(), location:''};
}

function localParse(raw){
  raw = raw.trim().replace(/\s+/g,' ');
  const dir = PAST_CUES.test(raw) ? 'past' : FUTURE_CUES.test(raw) ? 'future' : null;
  const cat = detectCategory(raw);
  const dr = detectDate(raw, dir);
  const rest = strip(raw, dr.strs);
  const tm = detectTimes(rest);
  const {title, location} = splitLocation(cleanTitle(strip(rest, tm.strs)));
  const base = {title: title || cat.l, location, notes:'', cat:cat.k};
  if(!tm.start) return {...base, allDay:true, start:sod(dr.date), end:addDays(sod(dr.date),1)};
  const start = new Date(dr.date); start.setHours(tm.start.h, tm.start.m, 0, 0);
  let end;
  if(tm.end){ end = new Date(start); end.setHours(tm.end.h, tm.end.m, 0, 0); if(end<=start) end = addDays(end,1); }
  else end = new Date(start.getTime() + 60*60000);
  return {...base, allDay:false, start, end};
}

/* ---------- understanding: AI endpoint when configured, built-in parser otherwise ---------- */
async function understand(text){
  if(CONFIG.AI_ENDPOINT){
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 9000);
      const res = await fetch(CONFIG.AI_ENDPOINT, {method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, today: ymd(new Date()), now: hm(new Date()), weekday: new Date().getDay(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone})});
      clearTimeout(t);
      if(res.ok){ const d = fromAI(await res.json(), text); if(d) return d; }
    }catch(e){}
  }
  const [d] = await Promise.all([localParse(text), sleep(350)]);
  return d;
}
// AI JSON: {title, date:"YYYY-MM-DD", time:"HH:MM"|null, endTime:"HH:MM"|null, location, notes, category}
function fromAI(j, text){
  if(!j || typeof j.date!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(j.date)) return null;
  const day = parseYMD(j.date);
  const cat = CATS.some(c=>c.k===j.category) ? j.category : detectCategory(text).k;
  const base = {title:String(j.title||'').trim() || catObj(cat).l, location:String(j.location||'').trim(), notes:String(j.notes||'').trim(), cat};
  const tp = s => (typeof s==='string' && /^\d{1,2}:\d{2}$/.test(s)) ? s.split(':').map(Number) : null;
  const st = tp(j.time);
  if(!st) return {...base, allDay:true, start:day, end:addDays(day,1)};
  const start = new Date(day); start.setHours(st[0], st[1], 0, 0);
  const et = tp(j.endTime);
  let end = et ? new Date(day.getFullYear(), day.getMonth(), day.getDate(), et[0], et[1]) : new Date(start.getTime()+60*60000);
  if(end<=start) end = addDays(end,1);
  return {...base, allDay:false, start, end};
}

const KEY = 'lived_events';
let events = [];
function load(){
  const rows = LS.get(KEY, null);
  if(rows) events = rows.map(r=>({...r, start:new Date(r.start), end:new Date(r.end)})).filter(e=>!isNaN(e.start));
  else {
    // one-time import of events saved on this device by the previous calendar app
    events = LS.get('ep_local_events', []).map(r=>({id:r.id||uid(), title:r.title, start:new Date(r.start), end:new Date(r.end), allDay:!!r.allDay,
      location:r.location||'', notes:r.notes||'', cat: CATS.some(c=>c.k===r.cat) ? r.cat : detectCategory(r.title||'').k})).filter(e=>!isNaN(e.start));
    persist();
  }
}
function persist(){ LS.set(KEY, events.map(e=>({...e, start:e.start.toISOString(), end:e.end.toISOString()}))); }
const isUpcoming = e => e.allDay ? sod(e.start) > todayLocal() : e.start > new Date();

/* =====================================================================
   Google Calendar — OAuth 2.0 token flow in the browser (Google Identity Services).
   Only the public Client ID is used; there is no client secret in a browser app.
   ===================================================================== */
const G_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
const clientId = () => CONFIG.GOOGLE_CLIENT_ID || '';
let tokenClient = null, accessToken = null, tokenExp = 0;
(function(){ const t = LS.get('gcal_token', null); if(t && t.exp > Date.now()+60e3){ accessToken = t.t; tokenExp = t.exp; } })();
const tokenValid = () => !!accessToken && tokenExp > Date.now()+30e3;
const gisReady = () => !!(window.google && google.accounts && google.accounts.oauth2);
function loadGIS(){
  if(!clientId() || document.getElementById('gis')) return;
  const s = document.createElement('script'); s.id='gis'; s.src='https://accounts.google.com/gsi/client'; s.async=true; document.head.appendChild(s);
}
// Must be called directly from a click, so Google's consent popup is allowed.
function ensureToken(){
  return new Promise((resolve, reject)=>{
    if(tokenValid()){ resolve(accessToken); return; }
    if(!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({client_id:clientId(), scope:G_SCOPE, callback:()=>{}});
    tokenClient.callback = r=>{
      if(r.error){ reject(r); return; }
      accessToken = r.access_token; tokenExp = Date.now() + (Number(r.expires_in)||3600)*1000;
      LS.set('gcal_token', {t:accessToken, exp:tokenExp}); LS.set('gcal_connected', 1);
      resolve(accessToken); renderFoot();
    };
    tokenClient.error_callback = e=>reject(e||{type:'popup'});
    tokenClient.requestAccessToken({prompt: LS.raw('gcal_connected') ? '' : 'consent'});
  });
}
function disconnect(){
  try{ if(accessToken && gisReady()) google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}
  accessToken = null; tokenExp = 0;
  ['gcal_token','gcal_connected'].forEach(LS.del);
}
const rfc = x => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}:00`;
function googleBody(d){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone, c = catObj(d.cat);
  const b = {summary:d.title, location:d.location||undefined, description:d.notes||undefined};
  if(c.g) b.colorId = c.g;
  if(d.allDay){ b.start={date:ymd(d.start)}; b.end={date:ymd(d.end)}; }
  else { b.start={dateTime:rfc(d.start), timeZone:tz}; b.end={dateTime:rfc(d.end), timeZone:tz}; }
  return b;
}
async function insertEvent(d){
  const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method:'POST', headers:{'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json'}, body:JSON.stringify(googleBody(d))});
  if(res.status===401){ accessToken=null; tokenExp=0; LS.del('gcal_token'); throw {code:'expired'}; }
  if(!res.ok) throw {code:'http', status:res.status};
  return res.json();
}
function templateUrl(d){
  const f = x => d.allDay ? ymd(x).replace(/-/g,'') : rfc(x).replace(/[-:]/g,'');
  const p = new URLSearchParams({action:'TEMPLATE', text:d.title, dates:`${f(d.start)}/${f(d.end)}`});
  if(!d.allDay) p.set('ctz', Intl.DateTimeFormat().resolvedOptions().timeZone);
  if(d.location) p.set('location', d.location);
  if(d.notes) p.set('details', d.notes);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
// Called from a click. Direct insert when a Client ID is configured; otherwise a pre-filled Google Calendar page.
function sendToGoogle(ev){
  if(!clientId() || !gisReady()){
    window.open(templateUrl(ev), '_blank', 'noopener');
    ev.g = 'opened'; persist();
    return Promise.resolve('opened');
  }
  const tp = ensureToken();
  return tp.then(()=>insertEvent(ev)).then(it=>{ ev.g = 'ok'; ev.gLink = it.htmlLink || ''; persist(); return 'ok'; });
}

function fit(){ text.style.height='auto'; text.style.height = Math.min(text.scrollHeight, 180) + 'px'; }

/* ---------- composer → review ---------- */
function renderReview(){

  const d = st.draft, c = catObj(d.cat), rel = relDay(d.start), up = isUpcoming(d);
  box.innerHTML = `
    <div class="review">
      <div class="card">
        <div class="c-head">
          <div class="emoji" aria-hidden="true">${c.e}</div>
          <div style="flex:1;min-width:0">
            <input class="c-title" id="fTitle" value="${esc(d.title)}" aria-label="שם האירוע">
            <div class="c-meta"><span class="tag ${up?'up':'past'}">${up?'מתוכנן':'קרה'}</span>${esc(c.l)}</div>
          </div>
        </div>
        <div class="rows">
          <div class="row">${ICON.cal}<div class="val">
            <label class="pick">${esc(rel || fullDate(d.start))}<input type="date" id="fDate" value="${ymd(d.start)}" aria-label="תאריך"></label>
            ${rel ? `<span class="sub">${esc(fullDate(d.start))}</span>` : ''}
          </div></div>
          <div class="row">${ICON.clock}<div class="val">
            ${d.allDay
              ? `<label class="pick soft">כל היום · הוספת שעה<input type="time" id="fStart" aria-label="שעה"></label>`
              : `<label class="pick">${hm(d.start)}<input type="time" id="fStart" value="${hm(d.start)}" aria-label="שעת התחלה"></label>
                 <span class="dim">–</span>
                 <label class="pick soft">${hm(d.end)}<input type="time" id="fEnd" value="${hm(d.end)}" aria-label="שעת סיום"></label>`}
          </div></div>
          ${d.location ? `<div class="row">${ICON.pin}<div class="val"><input class="txt" id="fLoc" value="${esc(d.location)}" aria-label="מיקום"></div></div>` : ''}
          ${d.notes ? `<div class="row">${ICON.note}<div class="val"><input class="txt" id="fNotes" value="${esc(d.notes)}" aria-label="פרטים"></div></div>` : ''}
        </div>

    </div>`;

}
function bindReview(){
  const d = st.draft;
  $('#fTitle').addEventListener('input', e=>{ d.title = e.target.value; });
  $('#fLoc') && $('#fLoc').addEventListener('input', e=>{ d.location = e.target.value; });
  $('#fNotes') && $('#fNotes').addEventListener('input', e=>{ d.notes = e.target.value; });
  document.querySelectorAll('#review .pick input').forEach(inp=>inp.addEventListener('click', ()=>{ try{ inp.showPicker(); }catch(e){} }));
  $('#fDate').addEventListener('change', e=>{
    if(!e.target.value) return;
    const nd = parseYMD(e.target.value), len = d.end - d.start;
    nd.setHours(d.start.getHours(), d.start.getMinutes(), 0, 0);
    d.start = nd; d.end = new Date(nd.getTime()+len); renderReview();
  });
  $('#fStart').addEventListener('change', e=>{
    if(!e.target.value) return;
    const [h,m] = e.target.value.split(':').map(Number);
    const len = d.allDay ? 60*60000 : d.end - d.start;
    const s = sod(d.start); s.setHours(h, m, 0, 0);
    d.allDay = false; d.start = s; d.end = new Date(s.getTime()+len); renderReview();
  });
  $('#fEnd') && $('#fEnd').addEventListener('change', e=>{
    if(!e.target.value) return;
    const [h,m] = e.target.value.split(':').map(Number);
    let en = sod(d.start); en.setHours(h, m, 0, 0);
    if(en<=d.start) en = addDays(en,1);
    d.end = en; renderReview();
  });
  $('#saveBtn').addEventListener('click', save);
  $('#cancelBtn').addEventListener('click', resetComposer);
}
async function submit(){
  const v = text.value.trim();
  if(!v || st.phase==='thinking') return;
  const seq = ++st.seq;
  st.phase = 'thinking'; renderReview();
  const d = await understand(v);
  if(seq!==st.seq) return;
  st.draft = d; st.phase = 'review'; renderReview();
  text.blur();
}
function resetComposer(){ st.seq++; st.phase='idle'; st.draft=null; text.value=''; renderReview(); }

function save(){
  const d = st.draft;
  const ev = {id:uid(), title:(d.title||'').trim() || catObj(d.cat).l, start:d.start, end:d.end, allDay:d.allDay,
    location:(d.location||'').trim(), notes:(d.notes||'').trim(), cat:d.cat};
  events.push(ev); persist();
  const google = sendToGoogle(ev);          // inside the click: popup / new tab allowed
  resetComposer();
  st.flash = ev.id; renderTimeline();
  const el = document.querySelector(`[data-id="${ev.id}"]`); el && el.scrollIntoView({behavior:'smooth', block:'center'});
  google.then(r=>{ toast(r==='ok' ? 'נשמר ונוסף ל-Google Calendar' : 'נשמר · אשרו את השמירה ב-Google Calendar'); renderTimeline(); })
        .catch(err=>toast(googleError(err, 'נשמר בציר הזמן. לא נוסף ל-Google Calendar')));
}
function googleError(err, fallback){
  if(err && (err.type==='popup_closed' || err.error==='access_denied')) return 'נשמר בציר הזמן. ההתחברות ל-Google בוטלה';
  return fallback;
}

/* ---------- timeline ---------- */
function evItem(e, prev){
  const c = catObj(e.cat), up = isUpcoming(e), rel = relDay(e.start);
  const same = prev && ymd(prev.start)===ymd(e.start);
  const meta = [up && rel ? `<span class="rel">${esc(rel)}</span>` : (!up && rel ? esc(rel) : ''), e.allDay ? '' : hm(e.start), esc(e.location)].filter(Boolean).join(' · ') || esc(c.l);
  const gAct = e.gLink ? `<a href="${esc(e.gLink)}" target="_blank" rel="noopener">פתיחה ב-Google Calendar</a>`
             : `<button type="button" data-act="google">הוספה ל-Google Calendar</button>`;
  return `<li class="ev${up?' up':''}${same?' same':''}${st.open===e.id?' open':''}${st.flash===e.id?' flash':''}" data-id="${e.id}">
    <div class="d"><b>${e.start.getDate()}</b><span>${DAYS_SHORT[e.start.getDay()]}</span></div>
    <div class="rail"><i></i></div>
    <div>
      <button type="button" class="body" data-act="toggle" aria-expanded="${st.open===e.id}">
        <span class="t"><em aria-hidden="true">${c.e}</em>${esc(e.title)}</span>
        <span class="m">${meta}</span>
      </button>
      <div class="more">
        <p>${esc(fullDate(e.start))}${e.allDay ? '' : ` · ${hm(e.start)}–${hm(e.end)}`}${e.location ? ` · ${esc(e.location)}` : ''}</p>
        ${e.notes ? `<p>${esc(e.notes)}</p>` : ''}
        <div class="acts">${gAct}<button type="button" class="del" data-act="del">מחיקה</button></div>
      </div>
    </div>
  </li>`;
}
function renderTimeline(){
  const box = $('#timeline');
  if(!events.length){
    box.innerHTML = `<div class="empty">
      <div class="ill" aria-hidden="true">🕰️</div>
      <h2>כאן יתחיל ציר הזמן שלך</h2>
      <p>כתבו משהו שקרה, או משהו שמתוכנן.</p>
      <div class="examples" id="examples">
        <button type="button">אתמול ארוחת ערב עם שרה ב-20:00</button>
        <button type="button">משחק כדורגל ביום רביעי שעבר</button>
        <button type="button">מחר פגישה עם יוסי ב-10 בתל אביב</button>
      </div></div>`;
    $('#examples').addEventListener('click', e=>{ const b = e.target.closest('button'); if(!b) return; text.value = b.textContent; submit(); });
    st.flash = null; return;
  }
  const up = events.filter(isUpcoming).sort((a,b)=>a.start-b.start);
  const past = events.filter(e=>!isUpcoming(e)).sort((a,b)=>b.start-a.start);
  let html = '';
  if(up.length){
    html += `<section class="sec up"><h2>בקרוב</h2><ol class="tl">${up.map((e,i)=>evItem(e, up[i-1])).join('')}</ol></section>`;
  }
  html += `<section class="sec"><h2>מה היה</h2>`;
  if(!past.length) html += `<div class="nopast">עוד אין כאן אירועים שקרו. כתבו משהו שקרה, והוא יופיע כאן.</div>`;
  const nowY = new Date().getFullYear();
  let i = 0;
  while(i < past.length){
    const m = past[i].start.getMonth(), y = past[i].start.getFullYear();
    const group = [];
    while(i < past.length && past[i].start.getMonth()===m && past[i].start.getFullYear()===y) group.push(past[i++]);
    html += `<h3 class="month">${MONTHS[m]}${y!==nowY ? `<small>${y}</small>` : ''}</h3><ol class="tl">${group.map((e,j)=>evItem(e, group[j-1])).join('')}</ol>`;
  }
  html += `</section>`;
  box.innerHTML = html;
  st.flash = null;
}
$('#timeline').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const li = b.closest('.ev'), ev = events.find(x=>x.id===li.dataset.id); if(!ev) return;
  const act = b.dataset.act;
  if(act==='toggle'){ st.open = st.open===ev.id ? null : ev.id; renderTimeline(); }
  else if(act==='del'){
    if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent = 'למחוק?'; return; }
    events = events.filter(x=>x.id!==ev.id); persist(); st.open = null; renderTimeline();
    toast('נמחק מציר הזמן');
  }
  else if(act==='google'){
    sendToGoogle(ev).then(r=>{ toast(r==='ok' ? 'נוסף ל-Google Calendar' : 'אשרו את השמירה ב-Google Calendar'); renderTimeline(); })
      .catch(err=>toast(googleError(err, 'לא הצלחנו להוסיף ל-Google Calendar')));
  }
});

function renderFoot(){
  $('#foot').innerHTML = (clientId() && (tokenValid() || LS.raw('gcal_connected'))) ? 'מחובר ל-Google Calendar · <button type="button" id="outBtn">התנתקות</button>' : '';
  $('#outBtn') && $('#outBtn').addEventListener('click', ()=>{ disconnect(); renderFoot(); toast('התנתקת מ-Google'); });
}

let toastT = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 3400);
}

/* ---------- events ---------- */
$('#form').addEventListener('submit', e=>{ e.preventDefault(); submit(); });
text.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); } });
text.addEventListener('input', syncInput);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && st.phase==='review') resetComposer(); });
// an upcoming event becomes history once its time passes
setInterval(()=>{ if(document.visibilityState==='visible' && st.open===null) renderTimeline(); }, 60e3);

load();
loadGIS();
renderReview();
renderTimeline();
renderFoot();

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
