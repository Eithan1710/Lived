<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventAi</title>
<meta name="description" content="כותבים אירוע, ה-AI מבין אותו, והוא נכנס ל-Google Calendar.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EventAi">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --line:#E6E8EC;
  --ink:#0F172A; --ink2:#475569; --muted:#94A3B8;
  --accent:#4F46E5; --accent-2:#4338CA; --accent-soft:#EEF2FF;
  --ok:#16A34A; --ok-soft:#DCFCE7; --err:#B91C1C;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:'Heebo',-apple-system,'Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; min-height:100dvh;}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0;}
input,textarea{font:inherit; color:inherit;}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px;}
svg.i{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:none;}
[hidden]{display:none !important;}

.wrap{max-width:520px; margin:0 auto; padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 28px); min-height:100dvh; display:flex; flex-direction:column;}
.brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; color:var(--ink2);}
.brand img{width:26px; height:26px; border-radius:8px;}

.hero{margin-top:12vh; transition:margin .3s var(--ease);}
.wrap.has-result .hero{margin-top:28px;}
h1{font-size:34px; line-height:1.15; font-weight:800; letter-spacing:-.5px; margin:0 0 18px;}
.wrap.has-result h1{font-size:22px; margin-bottom:12px;}

/* input */
.box{position:relative; border:1.5px solid var(--line); border-radius:22px; background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 32px -18px rgba(15,23,42,.25); transition:border-color .15s, box-shadow .15s;}
.box:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.box textarea{display:block; width:100%; border:0; background:transparent; resize:none; outline:none; font-size:19px; line-height:1.45; padding:18px 18px 18px 72px; min-height:64px; max-height:200px;}
.box textarea::placeholder{color:var(--muted);}
.go{position:absolute; left:10px; bottom:10px; width:46px; height:46px; border-radius:15px; background:var(--accent); color:#fff; display:grid; place-items:center; transition:background .15s, transform .1s, opacity .15s;}
.go:hover{background:var(--accent-2);}
.go:active{transform:scale(.94);}
.go:disabled{opacity:.35; pointer-events:none;}
.go .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.examples{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.examples button{font-size:14px; color:var(--ink2); background:var(--soft); border-radius:99px; padding:7px 13px; transition:background .12s;}
.examples button:hover{background:#ECEEF2;}

/* result */
.result{margin-top:22px; animation:up .25s var(--ease);}
@keyframes up{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.card{border:1.5px solid var(--line); border-radius:22px; padding:20px 20px 10px; background:#fff;}
.c-head{display:flex; gap:14px; align-items:center; margin-bottom:8px;}
.emoji{width:52px; height:52px; border-radius:16px; background:var(--soft); display:grid; place-items:center; font-size:27px; flex:none;}
.c-title{width:100%; border:0; border-bottom:2px solid transparent; font-size:22px; font-weight:800; letter-spacing:-.2px; padding:2px 0; background:transparent; outline:none; min-width:0;}
.c-title:focus{border-color:var(--accent);}
.c-cat{font-size:13px; color:var(--muted); font-weight:500;}
.rows{display:flex; flex-direction:column;}
.row{display:flex; align-items:center; gap:14px; padding:13px 0; border-top:1px solid var(--line); font-size:17px; min-height:52px;}
.row:first-child{border-top:0;}
.row svg{color:var(--muted); width:21px; height:21px;}
.row .val{flex:1; min-width:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.row .dim{color:var(--muted);}
.row input.txt{flex:1; min-width:0; border:0; outline:none; background:transparent; font-size:17px; padding:0;}
.pick{position:relative; display:inline-flex; align-items:center; border-radius:8px; padding:2px 6px; margin:-2px -6px; font-weight:600; font-variant-numeric:tabular-nums; cursor:pointer;}
.pick:hover{background:var(--soft);}
.pick input{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; cursor:pointer;}
.pick.soft{font-weight:500; color:var(--ink2);}
.sub{color:var(--muted); font-size:14px; margin-inline-start:4px;}

.cta{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:60px; margin-top:16px; border-radius:18px; background:var(--accent); color:#fff; font-size:18px; font-weight:700;
  box-shadow:0 14px 28px -14px var(--accent); transition:background .15s, transform .1s;}
.cta:hover{background:var(--accent-2);}
.cta:active{transform:scale(.985);}
.cta:disabled{opacity:.7; pointer-events:none;}
.cta .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite;}
.cta.ghost{background:var(--soft); color:var(--ink); box-shadow:none;}
.cta.ghost:hover{background:#ECEEF2;}
.link{display:block; margin:12px auto 0; color:var(--ink2); font-size:15px; font-weight:500; padding:8px 14px; border-radius:10px;}
.link:hover{background:var(--soft);}

/* thinking skeleton */
.sk{border:1.5px solid var(--line); border-radius:22px; padding:20px;}
.sk i{display:block; height:16px; border-radius:8px; margin:12px 0; background:linear-gradient(90deg,var(--soft) 25%,#FAFBFC 50%,var(--soft) 75%); background-size:200% 100%; animation:shimmer 1.1s infinite;}
.sk i:first-of-type{height:26px; width:60%; margin-top:4px;}
.sk .lbl{display:flex; align-items:center; gap:8px; color:var(--accent); font-weight:600; font-size:15px;}
.dots{display:inline-flex; gap:3px;} .dots b{width:5px; height:5px; border-radius:50%; background:currentColor; animation:blink 1s infinite;}
.dots b:nth-child(2){animation-delay:.15s;} .dots b:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,100%{opacity:.25;} 50%{opacity:1;}}
@keyframes shimmer{to{background-position:-200% 0;}}

/* done */
.done{text-align:center; padding:26px 8px 4px;}
.done .ok{width:72px; height:72px; border-radius:50%; background:var(--ok-soft); color:var(--ok); display:grid; place-items:center; margin:0 auto 14px; animation:pop .35s var(--ease);}
.done .ok svg{width:36px; height:36px; stroke-width:2.6;}
@keyframes pop{from{transform:scale(.6); opacity:0;} to{transform:none; opacity:1;}}
.done h2{font-size:24px; margin:0 0 4px; font-weight:800;}
.done p{margin:0; color:var(--ink2);}
.done a{color:var(--accent); font-weight:600; text-decoration:none; display:inline-block; margin-top:12px;}

.foot{margin-top:auto; padding-top:28px; text-align:center; font-size:13px; color:var(--muted);}
.foot button{color:var(--muted); text-decoration:underline; font-size:13px;}

.toast{position:fixed; left:50%; bottom:calc(24px + var(--sab)); transform:translateX(-50%); background:var(--ink); color:#fff; border-radius:14px; padding:12px 18px; font-size:15px; max-width:calc(100vw - 32px); box-shadow:0 16px 40px -16px rgba(15,23,42,.5); animation:up .2s var(--ease); z-index:10;}

@media (max-width:480px){
  h1{font-size:30px;}
  .hero{margin-top:9vh;}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <div class="brand"><img src="icon-192.png" alt="">EventAi</div>

  <section class="hero">
    <h1 id="headline">מה בתכנון?</h1>
    <form id="form" autocomplete="off">
      <div class="box">
        <textarea id="text" rows="1" enterkeyhint="go" aria-label="תיאור האירוע" placeholder="פגישה עם דני מחר ב-15:00"></textarea>
        <button type="submit" class="go" id="go" aria-label="המשך" disabled><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      </div>
    </form>
    <div class="examples" id="examples">
      <button type="button">פגישה עם יוסי מחר ב-14:00 בתל אביב</button>
      <button type="button">יום הולדת לאמא ב-20 באוקטובר</button>
      <button type="button">משחק כדורגל ביום ראשון ב-21:00</button>
    </div>
  </section>

  <section id="result" aria-live="polite"></section>

  <footer class="foot" id="foot"></footer>
</main>
<script>
'use strict';
/* =====================================================================
   EventAi — one flow: write an event → AI understands it → add to Google Calendar.

   CONFIG (both optional):
   - GOOGLE_CLIENT_ID: an OAuth "Web application" client ID. With it, "הוסף ליומן" saves the event
     straight into the user's Google Calendar. Without it, the button opens Google Calendar with the
     event already filled in (the user taps "שמירה" there).
   - AI_ENDPOINT: URL of the AI parser (see ai/worker.js). Without it, the built-in parser is used.
   ===================================================================== */
const CONFIG = {
  GOOGLE_CLIENT_ID: '',
  AI_ENDPOINT: ''
};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
function sod(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function hm(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function todayLocal(){ return sod(new Date()); }
const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:JSON.parse(v); }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const sleep = ms => new Promise(r=>setTimeout(r, ms));

const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const EN_MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const EN_DAYS = [['sunday','sun'],['monday','mon'],['tuesday','tue','tues'],['wednesday','wed'],['thursday','thu','thur','thurs'],['friday','fri'],['saturday','sat']];

function friendlyDate(d){
  const diff = Math.round((sod(d)-todayLocal())/DAY);
  const full = `יום ${DAYS[d.getDay()]}, ${d.getDate()} ב${MONTHS[d.getMonth()]}` + (d.getFullYear()!==new Date().getFullYear() ? ` ${d.getFullYear()}` : '');
  if(diff===0) return {main:'היום', sub:full};
  if(diff===1) return {main:'מחר', sub:full};
  return {main:full, sub:''};
}

/* =====================================================================
   Categories — picked automatically, never by the user.
   colorId = Google Calendar event color.
   ===================================================================== */
const CATS = [
  {k:'birthday', e:'🎂', l:'יום הולדת', g:'5',  words:['יום הולדת','יומולדת','יום-הולדת','birthday','bday']},
  {k:'health',   e:'🩺', l:'בריאות',   g:'11', words:['רופא','רופאה','רופא שיניים','בדיקה','בדיקות','טיפול','קופת חולים','doctor','dentist','checkup']},
  {k:'date',     e:'❤️', l:'דייט',     g:'4',  words:['דייט','רומנטי','date']},
  {k:'sport',    e:'⚽', l:'ספורט',    g:'2',  words:['כדורגל','כדורסל','טניס','פאדל','משחק','football','soccer','basketball','tennis','match','game']},
  {k:'gym',      e:'🏋️', l:'כושר',     g:'10', words:['כושר','חדר כושר','אימון','ריצה','יוגה','פילאטיס','gym','workout','run','yoga','pilates']},
  {k:'trip',     e:'✈️', l:'טיול',     g:'7',  words:['טיול','טיסה','חופשה','נסיעה','trip','flight','vacation','travel','hike']},
  {k:'show',     e:'🎬', l:'בידור',    g:'3',  words:['סרט','קולנוע','הופעה','הצגה','מופע','movie','cinema','concert','show']},
  {k:'study',    e:'📚', l:'לימודים',  g:'9',  words:['שיעור','מבחן','בחינה','הרצאה','קורס','לימודים','class','exam','lecture','course']},
  {k:'work',     e:'💼', l:'עבודה',    g:'9',  words:['פגישה','פגישת','ישיבה','ישיבת','עבודה','שיחה','זום','ראיון','meeting','call','work','zoom','interview','sync']},
  {k:'food',     e:'🍽️', l:'ארוחה',    g:'6',  words:['ארוחה','ארוחת','מסעדה','קפה','בראנץ׳','בראנץ','dinner','lunch','breakfast','brunch','restaurant','coffee']},
  {k:'family',   e:'👨‍👩‍👧', l:'משפחה',    g:'6',  words:['משפחה','הורים','אמא','אבא','סבתא','סבא','אחי','אחותי','family','mom','dad']},
  {k:'friends',  e:'🎉', l:'חברים',    g:'7',  words:['חברים','יציאה','מסיבה','בר','פאב','friends','party','bar','drinks']},
  {k:'other',    e:'📌', l:'אירוע',    g:'',   words:[]}
];
const catObj = k => CATS.find(c=>c.k===k) || CATS[CATS.length-1];

/* =====================================================================
   Built-in parser (Hebrew + English). Instant, works offline.
   "פגישה עם יוסי מחר ב-14:00 בתל אביב" → title, date, time, location, category.
   ===================================================================== */
const HEB = '[א-ת׳״]';
const HE_PREFIXES = ['ב','ל','מ','ו','ה','כ','ש'];

function tokenForms(token){
  const forms = new Set([token]);
  if(token.length>1 && HE_PREFIXES.includes(token[0])){
    forms.add(token.slice(1));
    if(token.length>2 && HE_PREFIXES.includes(token[1])) forms.add(token.slice(2));
  }
  return forms;
}
function detectCategory(text){
  const lower = text.toLowerCase();
  const forms = new Set();
  lower.split(/[^א-תa-z׳'-]+/).filter(Boolean).forEach(t=>tokenForms(t).forEach(f=>forms.add(f)));
  const has = w => /[\s-]/.test(w) ? lower.includes(w) : forms.has(w);
  return CATS.find(c=>c.words.some(has)) || catObj('other');
}

function detectDate(text){
  const today = todayLocal(), lower = text.toLowerCase();
  const fix = (d, hasYear) => (!hasYear && d < today) ? new Date(d.getFullYear()+1, d.getMonth(), d.getDate()) : d;
  let m;
  // "20 באוקטובר", "ה-3 לדצמבר 2027"
  m = text.match(new RegExp(`(?:ב-?|ה-?)?(\\d{1,2})\\s*(?:ב|ל)?(${MONTHS.join('|')})(?:\\s+(\\d{4}))?(?!${HEB})`));
  if(m && +m[1]>=1 && +m[1]<=31) return {date: fix(new Date(m[3]?+m[3]:today.getFullYear(), MONTHS.indexOf(m[2]), +m[1]), !!m[3]), strs:[m[0]], found:true};
  // "October 20", "20 Oct"
  const enM = `(${EN_MONTHS.map(x=>x+'[a-z]*').join('|')})`;
  m = lower.match(new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?${enM}\\b`)) || null;
  if(m) return {date: fix(new Date(today.getFullYear(), EN_MONTHS.indexOf(m[2].slice(0,3)), +m[1]), false), strs:[text.substr(m.index, m[0].length)], found:true};
  m = lower.match(new RegExp(`\\b${enM}\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b`));
  if(m) return {date: fix(new Date(today.getFullYear(), EN_MONTHS.indexOf(m[1].slice(0,3)), +m[2]), false), strs:[text.substr(m.index, m[0].length)], found:true};
  // "12/10", "12.10.2026"
  m = text.match(/(?<![\d:])(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?![\d:])/);
  if(m && +m[2]>=1 && +m[2]<=12 && +m[1]>=1 && +m[1]<=31){
    const y = m[3] ? (m[3].length===2 ? 2000 + +m[3] : +m[3]) : today.getFullYear();
    return {date: fix(new Date(y, +m[2]-1, +m[1]), !!m[3]), strs:[m[0]], found:true};
  }
  const word = re => text.match(re);
  if((m=word(new RegExp(`(?<!${HEB})(?:ב|ל)?מחרתיים(?!${HEB})`)))) return {date:addDays(today,2), strs:[m[0]], found:true};
  if((m=word(new RegExp(`(?<!${HEB})(?:ב|ל)?מחר(?!${HEB})`)))) return {date:addDays(today,1), strs:[m[0]], found:true};
  if((m=word(new RegExp(`(?<!${HEB})(?:ה|ל)?היום(?!${HEB})`)))) return {date:today, strs:[m[0]], found:true};
  if((m=lower.match(/\bday after tomorrow\b/))) return {date:addDays(today,2), strs:[text.substr(m.index,m[0].length)], found:true};
  if((m=lower.match(/\btomorrow\b|\btmrw\b/))) return {date:addDays(today,1), strs:[text.substr(m.index,m[0].length)], found:true};
  if((m=lower.match(/\btoday\b/))) return {date:today, strs:[text.substr(m.index,m[0].length)], found:true};
  const isNext = /הבא|הבאה|\bnext\b/i.test(text);
  for(let i=0;i<7;i++){
    // "ביום ראשון", "יום שני הבא", "בחמישי" (a bare "שני" is also a name, so it needs "יום" or "ב")
    const he = text.match(new RegExp(`(?<!${HEB})(?:(?:ב|ל)?יום\\s+|ב)${DAYS[i]}(?:\\s+(?:הבא|הקרוב))?(?!${HEB})`));
    const en = lower.match(new RegExp(`\\b(?:next\\s+|on\\s+|this\\s+)?(?:${EN_DAYS[i].join('|')})\\b`));
    const hit = he ? he[0] : en ? text.substr(en.index, en[0].length) : null;
    if(hit){
      let diff = (i - today.getDay() + 7) % 7;
      if(diff===0 && isNext) diff = 7;
      return {date:addDays(today,diff), strs:[hit], found:true};
    }
  }
  return {date:today, strs:[], found:false};
}

const EVENING = /בערב|בלילה|אחר הצהריים|אחה״צ|אחה"צ|בצהריים|evening|night|afternoon|\bpm\b/i;
const MORNING = /בבוקר|morning|\bam\b/i;
function timeParts(str, ctx){
  const m = str.match(/(\d{1,2})(?::(\d{2}))?\s*(וחצי|ורבע|am|pm|a\.m\.|p\.m\.)?/i);
  if(!m) return null;
  let h = +m[1], mi = m[2] ? +m[2] : 0;
  const suf = (m[3]||'').toLowerCase();
  if(suf==='וחצי') mi = 30; else if(suf==='ורבע') mi = 15;
  if(suf[0]==='p' && h<12) h += 12;
  if(suf[0]==='a' && h===12) h = 0;
  if(!m[2] || h<12){
    // "ב-8 בערב" → 20:00, "ב-3" → 15:00
    if(!suf.match(/^[ap]/) && h>=1 && h<12 && (EVENING.test(ctx) || (h<=7 && !MORNING.test(ctx)))) h += 12;
  }
  if(h>24 || mi>59) return null;
  return {h:h%24, m:mi};
}
const T = '(\\d{1,2}(?::\\d{2})?(?:\\s*(?:וחצי|ורבע|am|pm|a\\.m\\.|p\\.m\\.))?)';
function detectTimes(text){
  // ranges: "20:00-22:00", "בין 8 ל-10", "מ-18 עד 20", "6pm-8pm"
  let m = text.match(new RegExp(`(?:בין|מ-?|משעה|from)?\\s*${T}\\s*(?:-|–|עד|ל-?|to|until)\\s*${T}`, 'i'));
  if(m && (/:|am|pm|וחצי/i.test(m[0]) || /בין|מ-?|משעה|from/.test(m[0]))){
    const s=timeParts(m[1], text), e=timeParts(m[2], text);
    if(s && e) return {start:s, end:e, strs:[m[0]]};
  }
  // single: "ב-20:00", "בשעה 8", "at 6pm", "18:00", "6pm"
  m = text.match(new RegExp(`(?:ב-?|בשעה\\s*|at\\s+|@\\s*)${T}(?![\\d/.])`, 'i'));
  if(m){ const s=timeParts(m[1], text); if(s) return {start:s, strs:[m[0]]}; }
  m = text.match(/(?<![\d./])(\d{1,2}:\d{2}|\d{1,2}\s*(?:am|pm))(?![\d./])/i);
  if(m){ const s=timeParts(m[1], text); if(s) return {start:s, strs:[m[0]]}; }
  // "בערב", "בבוקר" with no number
  const TOD = [['אחר הצהריים',16],['בצהריים',13],['בבוקר',9],['בערב',19],['הערב',19],['בלילה',22],['morning',9],['noon',12],['afternoon',16],['evening',19],['tonight',20]];
  for(const [w,h] of TOD){
    const mm = text.match(/^[a-z]/.test(w) ? new RegExp(`\\b${w}\\b`,'i') : new RegExp(`(?<!${HEB})${w}(?!${HEB})`));
    if(mm) return {start:{h, m:0}, strs:[mm[0]]};
  }
  return {start:null, strs:[]};
}
function strip(text, strs){ let t = text; (strs||[]).forEach(s=>{ if(s) t = t.replace(s,' '); }); return t; }
function cleanWords(text){
  const stop = new Set(['בין','מ-','משעה','עד','ל-','ב-','ב','ל','בשעה','הבא','הבאה','הקרוב','-','–','at','on','from','to','next','the','this','in']);
  const words = text.replace(/[,،]+/g,' ').split(/\s+/).filter(Boolean);
  while(words.length && stop.has(words[words.length-1].toLowerCase())) words.pop();
  while(words.length && stop.has(words[0].toLowerCase())) words.shift();
  return words.filter(w=>!['ב-','ל-','מ-','בשעה','-','–'].includes(w)).join(' ').trim();
}
const CAT_WORDS = new Set(CATS.flatMap(c=>c.words));
// "משהו בתל אביב" → location "תל אביב"; "... @ place" and "... at place" work too.
function splitLocation(text){
  const at = text.match(/\s(?:@|at|in)\s+(.+)$/i);
  if(at) return {title:text.slice(0,at.index).trim(), location:at[1].trim()};
  const words = text.split(/\s+/).filter(Boolean);
  for(let i=1;i<words.length;i++){
    const w = words[i];
    if(w[0]==='ב' && w.length>2 && !CAT_WORDS.has(w) && !CAT_WORDS.has(w.slice(1)) && !['בלי','בשביל','ביחד','בערך','בבית'].includes(w)){
      const title = words.slice(0,i).join(' ').trim();
      const location = (w.slice(1) + ' ' + words.slice(i+1).join(' ')).trim();
      if(title) return {title, location};
    }
  }
  return {title:words.join(' ').trim(), location:''};
}

function localParse(raw){
  raw = raw.trim().replace(/\s+/g,' ');
  const cat = detectCategory(raw);
  const dr = detectDate(raw);
  const rest = strip(raw, dr.strs);
  const tm = detectTimes(rest);
  const leftover = strip(rest, tm.strs).replace(new RegExp(`(?<!${HEB})(?:בבוקר|בצהריים|אחר הצהריים|אחה״צ|אחה"צ|בערב|בלילה)(?!${HEB})`,'g'),' ');
  const {title, location} = splitLocation(cleanWords(leftover));
  let date = dr.date;
  if(!tm.start){
    // no time → an all-day event ("יום הולדת לאמא ב-20 באוקטובר")
    return {title: title || cat.l, location, notes:'', cat:cat.k, allDay:true, start:sod(date), end:addDays(sod(date),1)};
  }
  const start = new Date(date); start.setHours(tm.start.h, tm.start.m, 0, 0);
  if(!dr.found && start < new Date()) start.setDate(start.getDate()+1);   // "ב-9" when 9:00 already passed → tomorrow
  let end;
  if(tm.end){ end = new Date(start); end.setHours(tm.end.h, tm.end.m, 0, 0); if(end<=start) end = addDays(end,1); }
  else end = new Date(start.getTime() + 60*60000);
  return {title: title || cat.l, location, notes:'', cat:cat.k, allDay:false, start, end};
}

/* ---------- AI: remote model when configured, built-in parser otherwise ---------- */
async function understand(text){
  if(CONFIG.AI_ENDPOINT){
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 9000);
      const res = await fetch(CONFIG.AI_ENDPOINT, {method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text, now:new Date().toString(), tz:Intl.DateTimeFormat().resolvedOptions().timeZone})});
      clearTimeout(t);
      if(res.ok){ const d = fromAI(await res.json(), text); if(d) return d; }
    }catch(e){}
  }
  const [d] = await Promise.all([localParse(text), sleep(450)]);   // short, visible "understanding" beat
  return d;
}
// AI JSON: {title, date:"YYYY-MM-DD", time:"HH:MM"|null, endTime:"HH:MM"|null, location, notes, category}
function fromAI(j, text){
  if(!j || !j.date || !/^\d{4}-\d{2}-\d{2}$/.test(j.date)) return null;
  const day = parseYMD(j.date);
  const cat = CATS.some(c=>c.k===j.category) ? j.category : detectCategory(text).k;
  const base = {title:(j.title||'').trim() || catObj(cat).l, location:(j.location||'').trim(), notes:(j.notes||'').trim(), cat};
  const tp = s => (s && /^\d{1,2}:\d{2}$/.test(s)) ? s.split(':').map(Number) : null;
  const st = tp(j.time);
  if(!st) return {...base, allDay:true, start:day, end:addDays(day,1)};
  const start = new Date(day); start.setHours(st[0], st[1], 0, 0);
  const et = tp(j.endTime);
  let end = et ? new Date(day.getFullYear(), day.getMonth(), day.getDate(), et[0], et[1]) : new Date(start.getTime()+60*60000);
  if(end<=start) end = addDays(end,1);
  return {...base, allDay:false, start, end};
}

/* =====================================================================
   Google Calendar
   ===================================================================== */
const G_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
const clientId = () => CONFIG.GOOGLE_CLIENT_ID || LS.raw('gcal_client_id') || '';
let tokenClient = null, accessToken = null, tokenExp = 0;
(function(){ const t = LS.get('gcal_token', null); if(t && t.exp > Date.now()+60e3){ accessToken = t.t; tokenExp = t.exp; } })();
const tokenValid = () => !!accessToken && tokenExp > Date.now()+30e3;
const gisReady = () => !!(window.google && google.accounts && google.accounts.oauth2);
function loadGIS(){
  if(!clientId() || document.getElementById('gis')) return;
  const s = document.createElement('script'); s.id='gis'; s.src='https://accounts.google.com/gsi/client'; s.async=true; document.head.appendChild(s);
}
// Called directly from the click, so Google's sign-in popup is allowed.
function ensureToken(){
  return new Promise((resolve, reject)=>{
    if(tokenValid()){ resolve(accessToken); return; }
    if(!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({client_id:clientId(), scope:G_SCOPE, callback:()=>{}});
    tokenClient.callback = r=>{
      if(r.error){ reject(r); return; }
      accessToken = r.access_token; tokenExp = Date.now() + (Number(r.expires_in)||3600)*1000;
      LS.set('gcal_token', {t:accessToken, exp:tokenExp}); LS.set('gcal_connected', 1);
      resolve(accessToken);
    };
    tokenClient.error_callback = e=>reject(e||{type:'popup'});
    tokenClient.requestAccessToken({prompt: LS.raw('gcal_connected') ? '' : 'consent'});
  });
}
function disconnect(){
  try{ if(accessToken && gisReady()) google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}
  accessToken = null; tokenExp = 0;
  ['gcal_token','gcal_connected'].forEach(LS.del);
}
const rfc = x => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}:00`;
function googleBody(d){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone, c = catObj(d.cat);
  const b = {summary:d.title, location:d.location||undefined, description:d.notes||undefined};
  if(c.g) b.colorId = c.g;
  if(d.allDay){ b.start={date:ymd(d.start)}; b.end={date:ymd(d.end)}; }
  else { b.start={dateTime:rfc(d.start), timeZone:tz}; b.end={dateTime:rfc(d.end), timeZone:tz}; }
  return b;
}
async function insertEvent(d){
  const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method:'POST', headers:{'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json'}, body:JSON.stringify(googleBody(d))});
  if(res.status===401){ accessToken=null; tokenExp=0; LS.del('gcal_token'); throw {code:'expired'}; }
  if(!res.ok) throw {code:'http', status:res.status};
  return res.json();
}
// No OAuth client configured → open Google Calendar with the event pre-filled.
function templateUrl(d){
  const f = x => d.allDay ? ymd(x).replace(/-/g,'') : rfc(x).replace(/[-:]/g,'');
  const p = new URLSearchParams({action:'TEMPLATE', text:d.title, dates:`${f(d.start)}/${f(d.end)}`});
  if(!d.allDay) p.set('ctz', Intl.DateTimeFormat().resolvedOptions().timeZone);
  if(d.location) p.set('location', d.location);
  if(d.notes) p.set('details', d.notes);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

/* =====================================================================
   UI — idle → thinking → review → saving → done
   ===================================================================== */
const ICON = {
  cal:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  note:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  arrow:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  google:'<svg viewBox="0 0 48 48" width="22" height="22"><path fill="#fff" d="M45 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8a10 10 0 0 1-4.4 6.6v5.5h7.1C42.6 36.8 45 31.2 45 24.5zM24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7A22 22 0 0 0 24 46zM11.8 28.3a13 13 0 0 1 0-8.6V14H4.5a22 22 0 0 0 0 20zM24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3A22 22 0 0 0 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z" opacity=".95"/></svg>'
};
const st = {phase:'idle', draft:null, link:'', viaTemplate:false, seq:0};
const text = $('#text'), go = $('#go'), result = $('#result');

function fit(){ text.style.height='auto'; text.style.height = Math.min(text.scrollHeight, 200) + 'px'; }
function syncInput(){ fit(); go.disabled = !text.value.trim() || st.phase==='thinking'; $('#examples').hidden = !!text.value.trim() || st.phase!=='idle'; }

function render(){
  $('#wrap').classList.toggle('has-result', st.phase!=='idle');
  go.innerHTML = st.phase==='thinking' ? '<span class="spinner"></span>' : ICON.arrow;
  syncInput();
  if(st.phase==='idle'){ result.innerHTML=''; }
  else if(st.phase==='thinking'){
    result.innerHTML = `<div class="result sk"><div class="lbl">מבין את האירוע<span class="dots"><b></b><b></b><b></b></span></div><i></i><i style="width:80%"></i><i style="width:55%"></i></div>`;
  }
  else if(st.phase==='review' || st.phase==='saving') renderReview();
  else if(st.phase==='done') renderDone();
  renderFoot();
}

function renderReview(){
  const d = st.draft, c = catObj(d.cat), fd = friendlyDate(d.start);
  const saving = st.phase==='saving';
  result.innerHTML = `
    <div class="result">
      <div class="card">
        <div class="c-head">
          <div class="emoji" aria-hidden="true">${c.e}</div>
          <div style="flex:1;min-width:0">
            <input class="c-title" id="fTitle" value="${esc(d.title)}" aria-label="שם האירוע">
            <div class="c-cat">${esc(c.l)}</div>
          </div>
        </div>
        <div class="rows">
          <div class="row">${ICON.cal}<div class="val">
            <label class="pick">${esc(fd.main)}<input type="date" id="fDate" value="${ymd(d.start)}" aria-label="תאריך"></label>
            ${fd.sub ? `<span class="sub">${esc(fd.sub)}</span>` : ''}
          </div></div>
          <div class="row">${ICON.clock}<div class="val">
            ${d.allDay
              ? `<label class="pick soft">כל היום · הוספת שעה<input type="time" id="fStart" aria-label="שעת התחלה"></label>`
              : `<label class="pick">${hm(d.start)}<input type="time" id="fStart" value="${hm(d.start)}" aria-label="שעת התחלה"></label>
                 <span class="dim">–</span>
                 <label class="pick soft">${hm(d.end)}<input type="time" id="fEnd" value="${hm(d.end)}" aria-label="שעת סיום"></label>`}
          </div></div>
          ${d.location ? `<div class="row">${ICON.pin}<div class="val"><input class="txt" id="fLoc" value="${esc(d.location)}" aria-label="מיקום"></div></div>` : ''}
          ${d.notes ? `<div class="row">${ICON.note}<div class="val"><input class="txt" id="fNotes" value="${esc(d.notes)}" aria-label="פרטים"></div></div>` : ''}
        </div>
      </div>
      <button type="button" class="cta" id="addBtn" ${saving?'disabled':''}>${saving ? '<span class="spinner"></span>מוסיף…' : ICON.google + 'הוסף ליומן'}</button>
      <button type="button" class="link" id="cancelBtn">ביטול</button>
    </div>`;
  bindReview();
}

function bindReview(){
  const d = st.draft;
  $('#fTitle').addEventListener('input', e=>{ d.title = e.target.value; });
  $('#fLoc') && $('#fLoc').addEventListener('input', e=>{ d.location = e.target.value; });
  $('#fNotes') && $('#fNotes').addEventListener('input', e=>{ d.notes = e.target.value; });
  result.querySelectorAll('.pick input').forEach(inp=>{
    inp.addEventListener('click', ()=>{ try{ inp.showPicker(); }catch(e){} });
  });
  $('#fDate').addEventListener('change', e=>{
    if(!e.target.value) return;
    const nd = parseYMD(e.target.value), len = d.end - d.start;
    const s = new Date(nd); s.setHours(d.start.getHours(), d.start.getMinutes(), 0, 0);
    d.start = s; d.end = new Date(s.getTime()+len); renderReview();
  });
  $('#fStart').addEventListener('change', e=>{
    if(!e.target.value) return;
    const [h,m] = e.target.value.split(':').map(Number);
    const len = d.allDay ? 60*60000 : d.end - d.start;
    const s = sod(d.start); s.setHours(h, m, 0, 0);
    d.allDay = false; d.start = s; d.end = new Date(s.getTime()+len); renderReview();
  });
  $('#fEnd') && $('#fEnd').addEventListener('change', e=>{
    if(!e.target.value) return;
    const [h,m] = e.target.value.split(':').map(Number);
    let en = sod(d.start); en.setHours(h, m, 0, 0);
    if(en<=d.start) en = addDays(en,1);
    d.end = en; renderReview();
  });
  $('#addBtn').addEventListener('click', add);
  $('#cancelBtn').addEventListener('click', reset);
}

function renderDone(){
  const d = st.draft, fd = friendlyDate(d.start);
  const when = `${fd.main}${d.allDay ? '' : ' · ' + hm(d.start)}`;
  result.innerHTML = `
    <div class="result">
      <div class="done">
        <div class="ok">${ICON.check}</div>
        <h2>${st.viaTemplate ? 'נפתח ב-Google Calendar' : 'נוסף ליומן'}</h2>
        <p>${esc(d.title)} · ${esc(when)}</p>
        ${st.viaTemplate ? '<p style="margin-top:6px;font-size:14px">נשאר רק ללחוץ "שמירה" שם.</p>' : ''}
        ${st.link ? `<a href="${esc(st.link)}" target="_blank" rel="noopener">פתח ביומן</a>` : ''}
      </div>
      <button type="button" class="cta ghost" id="againBtn">אירוע נוסף</button>
    </div>`;
  $('#againBtn').addEventListener('click', ()=>{ reset(); text.focus(); });
}

function renderFoot(){
  $('#foot').innerHTML = tokenValid() || LS.raw('gcal_connected') ? 'מחובר ל-Google Calendar · <button type="button" id="outBtn">התנתקות</button>' : '';
  $('#outBtn') && $('#outBtn').addEventListener('click', ()=>{ disconnect(); renderFoot(); toast('התנתקת מ-Google'); });
}

async function submit(){
  const v = text.value.trim();
  if(!v || st.phase==='thinking' || st.phase==='saving') return;
  const seq = ++st.seq;
  st.phase = 'thinking'; render();
  const d = await understand(v);
  if(seq!==st.seq) return;
  st.draft = d; st.phase = 'review'; render();
  text.blur();
}

function add(){
  const d = st.draft;
  d.title = (d.title||'').trim() || catObj(d.cat).l;
  // Direct insert when a Google OAuth client is set up; otherwise a pre-filled Google Calendar page.
  if(!clientId() || !gisReady()){
    window.open(templateUrl(d), '_blank', 'noopener');
    st.viaTemplate = true; st.link = ''; st.phase = 'done'; render();
    return;
  }
  const tokenP = ensureToken();            // must start inside the click
  st.phase = 'saving'; render();
  tokenP.then(()=>insertEvent(d)).then(it=>{
    st.viaTemplate = false; st.link = it.htmlLink || ''; st.phase = 'done'; render();
  }).catch(err=>{
    st.phase = 'review'; render();
    if(err && (err.type==='popup_closed' || err.error==='access_denied')) toast('ההתחברות ל-Google בוטלה');
    else if(err && err.code==='expired') toast('צריך להתחבר מחדש — לחצו שוב');
    else toast('לא הצלחנו להוסיף. נסו שוב.');
  });
}

function reset(){
  st.seq++; st.phase = 'idle'; st.draft = null; st.link = '';
  text.value = ''; render();
}

let toastT = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 3200);
}

/* ---------- events ---------- */
$('#form').addEventListener('submit', e=>{ e.preventDefault(); submit(); });
text.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); } });
text.addEventListener('input', ()=>{ if(st.phase==='done'){ st.phase='idle'; render(); } syncInput(); });
$('#examples').addEventListener('click', e=>{ const b = e.target.closest('button'); if(!b) return; text.value = b.textContent; syncInput(); submit(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && (st.phase==='review' || st.phase==='done')) reset(); });

loadGIS();
render();
if(!matchMedia('(pointer:coarse)').matches) text.focus();

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
