# Deploys the site to GitHub Pages and writes config.js from repository variables.
# Settings → Pages → Source: "GitHub Actions".
# Settings → Secrets and variables → Actions → Secrets: GOOGLE_CLIENT_ID, AI_ENDPOINT (both optional).
# Stored as secrets so they stay out of the repo and are masked in the (public) Actions logs.
# They still end up in the deployed config.js, because the browser needs them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
        run: |
          mkdir _site
          cp index.html manifest.json sw.js icon.svg icon-192.png icon-512.png apple-touch-icon.png _site/
          node -e 'const e=process.env; require("fs").writeFileSync("_site/config.js", "window.LIVED_CONFIG = " + JSON.stringify({GOOGLE_CLIENT_ID: e.GOOGLE_CLIENT_ID || "", AI_ENDPOINT: e.AI_ENDPOINT || ""}) + ";\n")'
          echo "config.js written"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
